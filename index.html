<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワンクリックコピー | サイドパネル</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      background-color: #f4f6f9;
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* サイドパネル */
    .side-panel {
      width: 380px;
      background-color: #ffffff;
      border-right: 1px solid #e0e0e0;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #007bff;
      padding-bottom: 8px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #444;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* ボタン共通 */
    .action-main-btn {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-main-btn:hover {
      background-color: #0056b3;
    }

    .memo-open-btn {
      background-color: #6c757d;
    }
    .memo-open-btn:hover {
      background-color: #5a6268;
    }

    /* リスト構造（スクロール可能） */
    .card-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 4px;
    }

    /* グループごとにまとめるコンテナカード */
    .group-card {
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: default;
      transition: opacity 0.2s, border-color 0.2s;
    }

    .group-card.dragging {
      opacity: 0.4;
      border: 2px dashed #007bff;
    }

    .group-header {
      font-size: 0.85rem;
      font-weight: bold;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 6px;
      cursor: grab;
      user-select: none;
    }
    .group-header:active {
      cursor: grabbing;
    }

    /* グループ内の各項目 */
    .group-items-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-block {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: opacity 0.2s, border-color 0.2s;
    }

    .item-block.dragging {
      opacity: 0.4;
      border: 2px dashed #007bff;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-label-area {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .drag-handle-item {
      cursor: grab;
      font-size: 0.8rem;
      color: #aaa;
      padding: 0 2px;
      user-select: none;
    }
    .drag-handle-item:active {
      cursor: grabbing;
      color: #555;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #555;
    }

    /* コピー完了メッセージ */
    .copy-feedback {
      font-size: 0.6rem;
      font-weight: bold;
      color: #28a745;
      background-color: #e8f5e9;
      border: 1px solid #c8e6c9;
      padding: 1px 5px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .copy-feedback.show {
      opacity: 1;
    }

    .card-actions {
      display: flex;
      gap: 4px;
    }

    .action-btn {
      background: none;
      border: none;
      font-size: 0.65rem;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: bold;
    }

    .edit-btn {
      color: #007bff;
      background: #e9f3ff;
    }
    .edit-btn:hover { background: #d0e5ff; }

    .delete-btn {
      color: #dc3545;
      background: #f8d7da;
    }
    .delete-btn:hover { background: #f5c6cb; }

    .copy-btn {
      width: 100%;
      text-align: left;
      background: #fdfdfd;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #2c3e50;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .copy-btn:hover {
      background-color: #e9f3ff;
      border-color: #007bff;
      color: #007bff;
    }

    .copy-btn::after {
      content: "📋";
      font-size: 0.75rem;
      opacity: 0.5;
    }

    /* ポップアップ（モーダル）共通の背景 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 1000;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* すべてのモーダルで幅を320pxに統一 */
    .modal-content, .memo-modal-content {
      background: #ffffff;
      width: 320px;
      max-height: 85vh;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateY(-20px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.show .modal-content,
    .modal-overlay.show .memo-modal-content {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 1rem;
      font-weight: bold;
      color: #333;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: bold;
      color: #555;
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .form-textarea {
      resize: vertical;
      height: 80px;
    }

    .form-add-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f9f9f9;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #eee;
    }

    .company-list-container {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
      padding-right: 2px;
    }

    .company-item-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #fff;
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 6px;
    }

    .company-item-inputs {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .company-item-inputs input {
      flex: 1;
      padding: 4px 6px;
      font-size: 0.85rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .shortcut-hint, .memo-status {
      font-size: 0.7rem;
      color: #888;
    }

    .btn-submit {
      background: #007bff;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .btn-submit:hover { background: #0056b3; }

    .btn-add-sub {
      background: #28a745;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      align-self: flex-end;
    }
    .btn-add-sub:hover { background: #218838; }

    .btn-del-sub {
      background: #dc3545;
      color: white;
      border: none;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
    }
    .btn-del-sub:hover { background: #c82333; }
  </style>
</head>
<body>

  <!-- サイドパネル -->
  <aside class="side-panel" id="sidePanel">
    <div class="panel-header">
      <span class="panel-title">コピーリスト</span>
      <div class="header-actions">
        <button class="action-main-btn memo-open-btn" id="openMemoModal">🏢 会社・メアド管理</button>
        <button class="action-main-btn" id="openModal">追加</button>
      </div>
    </div>
    
    <div class="card-list" id="cardList">
      <!-- JavaScriptで動的にグループごとに生成されます -->
    </div>
  </aside>

  <!-- 項目追加・編集用モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">新しい項目を追加</div>
      
      <div class="form-group">
        <label class="form-label">グループ名</label>
        <input type="text" id="inputGroup" class="form-input" placeholder="例: よく使う文面、アドレスなど" list="groupSuggestions">
        <datalist id="groupSuggestions"></datalist>
      </div>

      <div class="form-group">
        <label class="form-label">ラベル（項目のタイトル）</label>
        <input type="text" id="inputLabel" class="form-input" placeholder="例: 挨拶、返信など">
      </div>

      <div class="form-group">
        <label class="form-label">コピーするテキスト</label>
        <textarea id="inputText" class="form-textarea" placeholder="コピーさせたい内容を入力"></textarea>
      </div>

      <div class="modal-footer">
        <span class="shortcut-hint">Ctrl + Enter で保存</span>
        <button class="btn-submit" id="saveBtn">追加する</button>
      </div>
    </div>
  </div>

  <!-- 複数会社名・メールアドレス登録用モーダル（幅320pxに統一・縦並び） -->
  <div class="modal-overlay" id="memoModalOverlay">
    <div class="modal-content memo-modal-content">
      <div class="modal-title">会社名・メールアドレスの管理</div>
      
      <div class="form-group">
        <label class="form-label">新しいセットを追加</label>
        <div class="form-add-box">
          <input type="text" id="newCompanyName" class="form-input" placeholder="会社名">
          <input type="email" id="newEmailAddress" class="form-input" placeholder="メールアドレス">
          <button class="btn-add-sub" id="addCompanyBtn">追加する</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">登録済み一覧（自動保存）</label>
        <div class="company-list-container" id="companyListContainer">
          <!-- 動的に追加されます -->
        </div>
      </div>

      <div class="modal-footer">
        <span class="memo-status" id="memoStatus">自動保存されます</span>
        <button class="btn-submit" id="closeMemoBtn">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    const COPY_ITEMS_KEY = 'one_click_copy_items_v8';
    const COMPANIES_STORAGE_KEY = 'one_click_copy_companies_list';

    let copyItems = [
      {
        id: '1',
        group: 'メールテンプレート',
        label: 'お礼と挨拶',
        text: 'お世話になっております。よろしくお願いいたします。'
      }
    ];

    let companiesList = [
      { id: 'c1', company: '株式会社〇〇', email: 'info@example.com' }
    ];

    function loadItems() {
      const saved = localStorage.getItem(COPY_ITEMS_KEY);
      if (saved) {
        try { copyItems = JSON.parse(saved); } catch (e) { console.error(e); }
      }
      const savedCompanies = localStorage.getItem(COMPANIES_STORAGE_KEY);
      if (savedCompanies) {
        try { companiesList = JSON.parse(savedCompanies); } catch (e) { console.error(e); }
      }
    }

    function saveItems() {
      localStorage.setItem(COPY_ITEMS_KEY, JSON.stringify(copyItems));
    }

    function saveCompanies() {
      localStorage.setItem(COMPANIES_STORAGE_KEY, JSON.stringify(companiesList));
    }

    const openModalBtn = document.getElementById('openModal');
    const modalOverlay = document.getElementById('modalOverlay');
    const saveBtn = document.getElementById('saveBtn');
    const modalTitle = document.getElementById('modalTitle');
    const inputGroup = document.getElementById('inputGroup');
    const inputLabel = document.getElementById('inputLabel');
    const inputText = document.getElementById('inputText');
    const cardList = document.getElementById('cardList');
    const groupSuggestions = document.getElementById('groupSuggestions');

    let editingId = null;

    function renderCards() {
      cardList.innerHTML = '';

      const groupNames = [...new Set(copyItems.map(item => item.group || '未分類'))];

      groupNames.forEach(groupName => {
        const items = copyItems.filter(item => (item.group || '未分類') === groupName);
        if (items.length === 0) return;

        const groupCard = document.createElement('div');
        groupCard.className = 'group-card';
        groupCard.setAttribute('draggable', 'true');
        groupCard.setAttribute('data-group', groupName);

        const header = document.createElement('div');
        header.className = 'group-header';
        header.innerHTML = `<span>📂 ${escapeHTML(groupName)}</span><span>(${items.length})</span>`;
        groupCard.appendChild(header);

        const itemsContainer = document.createElement('div');
        itemsContainer.className = 'group-items-container';

        items.forEach(item => {
          const previewText = item.text.length > 20 ? item.text.substring(0, 20) + '...' : item.text;
          const itemBlock = document.createElement('div');
          itemBlock.className = 'item-block';
          itemBlock.setAttribute('draggable', 'true');
          itemBlock.setAttribute('data-id', item.id);
          itemBlock.setAttribute('data-text', item.text);

          itemBlock.innerHTML = `
            <div class="card-header">
              <div class="card-label-area">
                <span class="drag-handle-item" title="ドラッグして移動">☰</span>
                <span class="card-label">${escapeHTML(item.label)}</span>
                <span class="copy-feedback">コピーしました！</span>
              </div>
              <div class="card-actions">
                <button class="action-btn edit-btn" onclick="openEditModal('${item.id}')">編集</button>
                <button class="action-btn delete-btn" onclick="deleteCard('${item.id}')">削除</button>
              </div>
            </div>
            <button class="copy-btn" onclick="copyText(this)">
              ${escapeHTML(previewText)}
            </button>
          `;
          itemsContainer.appendChild(itemBlock);
        });

        groupCard.appendChild(itemsContainer);
        cardList.appendChild(groupCard);
      });

      updateGroupSuggestions();
      initDragAndDrop();
    }

    function initDragAndDrop() {
      const groupCards = cardList.querySelectorAll('.group-card');
      groupCards.forEach(groupCard => {
        groupCard.addEventListener('dragstart', (e) => {
          if (e.target !== groupCard && !e.target.classList.contains('group-header')) return;
          e.stopPropagation();
          groupCard.classList.add('dragging');
          e.dataTransfer.setData('text/plain', 'group:' + groupCard.getAttribute('data-group'));
          e.dataTransfer.effectAllowed = 'move';
        });

        groupCard.addEventListener('dragend', (e) => {
          e.stopPropagation();
          groupCard.classList.remove('dragging');
          groupCards.forEach(c => c.classList.remove('drag-over'));
        });

        groupCard.addEventListener('dragover', (e) => {
          e.preventDefault();
          const draggingGroup = cardList.querySelector('.group-card.dragging');
          if (!draggingGroup || draggingGroup === groupCard) return;

          const rect = groupCard.getBoundingClientRect();
          const midpoint = rect.top + rect.height / 2;

          if (e.clientY < midpoint) {
            cardList.insertBefore(draggingGroup, groupCard);
          } else {
            cardList.insertBefore(draggingGroup, groupCard.nextElementSibling);
          }
        });

        groupCard.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation();
          updateItemsOrderFromDOM();
        });
      });

      const itemBlocks = cardList.querySelectorAll('.item-block');
      itemBlocks.forEach(itemBlock => {
        itemBlock.addEventListener('dragstart', (e) => {
          e.stopPropagation();
          itemBlock.classList.add('dragging');
          e.dataTransfer.setData('text/plain', 'item:' + itemBlock.getAttribute('data-id'));
          e.dataTransfer.effectAllowed = 'move';
        });

        itemBlock.addEventListener('dragend', (e) => {
          e.stopPropagation();
          itemBlock.classList.remove('dragging');
          itemBlocks.forEach(c => c.classList.remove('drag-over'));
        });

        itemBlock.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const draggingItem = cardList.querySelector('.item-block.dragging');
          if (!draggingItem || draggingItem === itemBlock) return;

          const targetContainer = itemBlock.closest('.group-items-container');
          const rect = itemBlock.getBoundingClientRect();
          const midpoint = rect.top + rect.height / 2;

          if (e.clientY < midpoint) {
            targetContainer.insertBefore(draggingItem, itemBlock);
          } else {
            targetContainer.insertBefore(draggingItem, itemBlock.nextElementSibling);
          }
        });

        itemBlock.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation();
          updateItemsOrderFromDOM();
        });
      });
    }

    function updateItemsOrderFromDOM() {
      const newCopyItems = [];
      const groupCards = cardList.querySelectorAll('.group-card');

      groupCards.forEach(groupCard => {
        const groupName = groupCard.getAttribute('data-group');
        const itemBlocks = groupCard.querySelectorAll('.item-block');

        itemBlocks.forEach(block => {
          const id = block.getAttribute('data-id');
          const item = copyItems.find(i => i.id === id);
          if (item) {
            item.group = groupName;
            newCopyItems.push(item);
          }
        });
      });

      copyItems = newCopyItems;
      saveItems();
    }

    function updateGroupSuggestions() {
      const groups = [...new Set(copyItems.map(item => item.group))];
      groupSuggestions.innerHTML = '';
      groups.forEach(g => {
        const option = document.createElement('option');
        option.value = g;
        groupSuggestions.appendChild(option);
      });
    }

    openModalBtn.addEventListener('click', () => {
      editingId = null;
      modalTitle.textContent = '新しい項目を追加';
      saveBtn.textContent = '追加する';
      inputGroup.value = '';
      inputLabel.value = '';
      inputText.value = '';
      modalOverlay.classList.add('show');
      inputGroup.focus();
    });

    function openEditModal(id) {
      const item = copyItems.find(i => i.id === id);
      if (!item) return;

      editingId = id;
      modalTitle.textContent = '項目を編集';
      saveBtn.textContent = '更新する';
      inputGroup.value = item.group || '';
      inputLabel.value = item.label || '';
      inputText.value = item.text || '';
      modalOverlay.classList.add('show');
      inputGroup.focus();
    }

    const closeModal = () => {
      modalOverlay.classList.remove('show');
      editingId = null;
    };

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    function handleSave() {
      const group = inputGroup.value.trim() || '未分類';
      const label = inputLabel.value.trim();
      const text = inputText.value.trim();

      if (!label || !text) {
        alert('ラベルとコピーするテキストの両方を入力してください。');
        return;
      }

      if (editingId) {
        const item = copyItems.find(i => i.id === editingId);
        if (item) {
          item.group = group;
          item.label = label;
          item.text = text;
        }
      } else {
        const newItem = {
          id: Date.now().toString(),
          group,
          label,
          text
        };
        copyItems.push(newItem);
      }

      saveItems();
      renderCards();
      closeModal();
    }

    saveBtn.addEventListener('click', handleSave);

    function handleShortcut(e) {
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        handleSave();
      }
    }

    inputGroup.addEventListener('keydown', handleShortcut);
    inputLabel.addEventListener('keydown', handleShortcut);
    inputText.addEventListener('keydown', handleShortcut);

    function deleteCard(id) {
      if (confirm('この項目を削除してもよろしいですか？')) {
        copyItems = copyItems.filter(i => i.id !== id);
        saveItems();
        renderCards();
      }
    }

    function copyText(button) {
      const itemBlock = button.closest('.item-block');
      const text = itemBlock.getAttribute('data-text');
      const feedback = itemBlock.querySelector('.copy-feedback');

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showFeedback(feedback);
        }).catch(() => {
          fallbackCopyText(text, feedback);
        });
      } else {
        fallbackCopyText(text, feedback);
      }
    }

    function fallbackCopyText(text, feedback) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.top = "0";
      textArea.style.left = "0";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showFeedback(feedback);
        } else {
          alert('コピーに失敗しました。');
        }
      } catch (err) {
        alert('コピーに対応していない環境です。');
      }

      document.body.removeChild(textArea);
    }

    function showFeedback(feedbackElement) {
      feedbackElement.classList.add('show');
      setTimeout(() => {
        feedbackElement.classList.remove('show');
      }, 1500);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // --- 複数会社名・メールアドレス管理モーダル関連 ---
    const openMemoModalBtn = document.getElementById('openMemoModal');
    const memoModalOverlay = document.getElementById('memoModalOverlay');
    const closeMemoBtn = document.getElementById('closeMemoBtn');
    const companyListContainer = document.getElementById('companyListContainer');
    const newCompanyName = document.getElementById('newCompanyName');
    const newEmailAddress = document.getElementById('newEmailAddress');
    const addCompanyBtn = document.getElementById('addCompanyBtn');

    window.addEventListener('DOMContentLoaded', () => {
      loadItems();
      renderCards();
      renderCompaniesList();
    });

    openMemoModalBtn.addEventListener('click', () => {
      memoModalOverlay.classList.add('show');
    });

    const closeMemoModal = () => {
      memoModalOverlay.classList.remove('show');
    };

    closeMemoBtn.addEventListener('click', closeMemoModal);
    memoModalOverlay.addEventListener('click', (e) => {
      if (e.target === memoModalOverlay) closeMemoModal();
    });

    function renderCompaniesList() {
      companyListContainer.innerHTML = '';
      companiesList.forEach((comp) => {
        const row = document.createElement('div');
        row.className = 'company-item-row';
        row.innerHTML = `
          <div class="company-item-inputs">
            <input type="text" value="${escapeHTML(comp.company)}" placeholder="会社名" oninput="updateCompanyField('${comp.id}', 'company', this.value)">
            <button class="btn-del-sub" onclick="deleteCompany('${comp.id}')">削除</button>
          </div>
          <input type="email" value="${escapeHTML(comp.email)}" placeholder="メールアドレス" oninput="updateCompanyField('${comp.id}', 'email', this.value)">
        `;
        companyListContainer.appendChild(row);
      });
    }

    addCompanyBtn.addEventListener('click', () => {
      const compVal = newCompanyName.value.trim();
      const emailVal = newEmailAddress.value.trim();

      if (!compVal && !emailVal) return;

      companiesList.push({
        id: Date.now().toString(),
        company: compVal,
        email: emailVal
      });

      newCompanyName.value = '';
      newEmailAddress.value = '';
      saveCompanies();
      renderCompaniesList();
    });

    function updateCompanyField(id, field, value) {
      const target = companiesList.find(c => c.id === id);
      if (target) {
        target[field] = value;
        saveCompanies();
      }
    }

    function deleteCompany(id) {
      companiesList = companiesList.filter(c => c.id !== id);
      saveCompanies();
      renderCompaniesList();
    }
  </script>

</body>
</html>
